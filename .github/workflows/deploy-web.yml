name: Deploy web to Hugging Face

# Publishes web/public/ (the built site) to a static Hugging Face Space.
# web/build.py generates the pages from web/src/; the generated files are committed, and this job
# fails if they are stale, so what is reviewed is exactly what ships.
# Setup (once): repo secret HF_TOKEN (write token) and repo variable HF_SPACE, e.g. "your-user/trama".
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Set the HF_TOKEN secret and the HF_SPACE variable (owner/space-name) in the repository settings."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the generated site is up to date
        run: python web/build.py --check

      - name: Upload web/public/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install --quiet "huggingface_hub>=0.25"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="static", exist_ok=True)
          api.upload_folder(
              repo_id=space, repo_type="space", folder_path="web/public",
              commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]}",
              delete_patterns=["*"],  # mirror web/public/ exactly
          )
          print(f"Deployed to https://huggingface.co/spaces/{space}")
          PY
